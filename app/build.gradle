plugins { id 'com.android.application' }

android {
    namespace 'com.poligran.mibolsillo'
    compileSdk 34

    defaultConfig {
        applicationId "com.poligran.mibolsillo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.2'

    // Las librerias de AndroidX arrastran kotlin-stdlib en versiones distintas.
    // Desde Kotlin 1.8 las clases de jdk7 y jdk8 viven dentro de kotlin-stdlib,
    // asi que se alinean todas en la misma version para evitar duplicados.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'alinea la version y evita clases duplicadas'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'alinea la version y evita clases duplicadas'
        }
    }
}